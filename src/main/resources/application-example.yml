spring:
  application:
    name: redpic
  ai:
    deepseek:
      api-key: 你的DeepSeek API Key
      chat:
        options:
          model: deepseek-chat
          max-tokens: 521
    zhipuai:
      api-key: 你的智谱APIKey
      chat:
        options:
          model: glm-4v-plus
          max-tokens: 200
      embedding:
        options:
          model: embedding-3


server:
  port: 8080
redpic:
  ai:
    prompt:
      default: prompts/chat-redpic-default.st
      expert: prompts/chat-redpic-expert.st
      image: prompts/chat-redpic-image.st
