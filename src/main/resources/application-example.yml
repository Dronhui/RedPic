spring:
  application:
    name: redpic
  ai:
    deepseek:
      api-key:
      chat:
        options:
          model: deepseek-chat
          max-tokens: 521
    zhipuai:
      api-key:
      chat:
        options:
          model: glm-4v-plus
      embedding:
        options:
          model: embedding-3
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key:
      chat:
        options:
          model: qwen3-vl-plus
          max-tokens: 521
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/redpic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password:

server:
  port: 8080
