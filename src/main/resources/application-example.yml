spring:
  application:
    name: redpic
  ai:
    deepseek:
      api-key:
      chat:
        options:
          model: deepseek-chat
          max-tokens: 521
    zhipuai:
      api-key:
      chat:
        options:
          model: glm-4v-plus
      embedding:
        options:
          model: embedding-3
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key:
      chat:
        options:
          model: qwen3-vl-plus
          max-tokens: 521



server:
  port: 8080
redpic:
  ai:
    prompt:
      default: prompts/chat-redpic-default.st
      expert: prompts/chat-redpic-expert.st
      image: prompts/chat-redpic-image.st
