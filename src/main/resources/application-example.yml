spring:
  application:
    name: redpic
  ai:
    deepseek:
      api-key:
      chat:
        options:
          model: deepseek-chat
          max-tokens: 521
    zhipuai:
      api-key:
      chat:
        options:
          model: glm-4v-plus
      embedding:
        options:
          model: embedding-3
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key:
      chat:
        options:
          model: qwen3-vl-plus
          max-tokens: 521
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/redpic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password:

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 3000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


server:
  port: 8080