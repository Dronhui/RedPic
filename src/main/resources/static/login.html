<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RedPic · 红色文化多模态解析</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%238b1a1a'/%3E%3Cpath fill='%23f59e0b' d='M16 5l2.9 6.6 7.1.7-5.3 4.8 1.5 7L16 20.9 9.8 24.1l1.5-7L6 12.3l7.1-.7z'/%3E%3C/svg%3E" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }

  body {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(255, 245, 220, 0.95) 0%, rgba(255, 235, 205, 0) 55%),
      radial-gradient(circle at 85% 85%, rgba(139, 26, 26, 0.18) 0%, rgba(139, 26, 26, 0) 60%),
      linear-gradient(135deg, #fdf3dc 0%, #f7e4c0 45%, #f0d4a8 75%, #e8c39a 100%);
    background-attachment: fixed;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.35;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: multiply;
  }

  .rays {
    position: fixed;
    left: 50%; bottom: -30%;
    width: 160vmax; height: 160vmax;
    transform: translateX(-50%);
    z-index: 0;
    pointer-events: none;
    background: conic-gradient(
      from 0deg at 50% 50%,
      transparent 0deg, rgba(139, 26, 26, 0.06) 6deg, transparent 12deg,
      rgba(139, 26, 26, 0.05) 18deg, transparent 24deg,
      rgba(139, 26, 26, 0.06) 30deg, transparent 36deg,
      rgba(139, 26, 26, 0.05) 42deg, transparent 48deg,
      rgba(139, 26, 26, 0.06) 54deg, transparent 60deg,
      transparent 180deg,
      rgba(139, 26, 26, 0.06) 186deg, transparent 192deg,
      rgba(139, 26, 26, 0.05) 198deg, transparent 204deg,
      rgba(139, 26, 26, 0.06) 210deg, transparent 216deg,
      rgba(139, 26, 26, 0.05) 222deg, transparent 228deg,
      rgba(139, 26, 26, 0.06) 234deg, transparent 240deg
    );
    animation: raysSpin 120s linear infinite;
    opacity: 1;
  }
  @keyframes raysSpin {
    from { transform: translateX(-50%) rotate(0deg); }
    to   { transform: translateX(-50%) rotate(360deg); }
  }

  .big-star {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 560px; height: 560px;
    z-index: 0;
    pointer-events: none;
    opacity: 0.08;
    animation: starFloat 12s ease-in-out infinite;
  }
  @keyframes starFloat {
    0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    50%      { transform: translate(-50%, -52%) scale(1.06) rotate(8deg); }
  }

  .mini-stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .mini-stars .s { position: absolute; fill: #f5deb3; opacity: 0; animation: twinkle 4s ease-in-out infinite; }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.6); }
    50%      { opacity: 0.5; transform: scale(1); }
  }

  .auth-card {
    position: relative;
    z-index: 10;
    width: min(430px, 92vw);
    padding: 42px 38px 36px;
    border-radius: 24px;
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.72), rgba(255, 250, 240, 0.55));
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border: 1.5px solid rgba(139, 26, 26, 0.35);
    box-shadow:
      0 0 0 1px rgba(245, 158, 11, 0.15),
      0 0 26px rgba(245, 158, 11, 0.18),
      0 20px 50px rgba(139, 26, 26, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.8);
    animation: cardGlow 4s ease-in-out infinite alternate;
  }
  @keyframes cardGlow {
    from { box-shadow: 0 0 0 1px rgba(245,158,11,0.15), 0 0 22px rgba(245,158,11,0.14), 0 20px 50px rgba(139,26,26,0.16), inset 0 1px 0 rgba(255,255,255,0.8); }
    to   { box-shadow: 0 0 0 1px rgba(245,158,11,0.28), 0 0 38px rgba(245,158,11,0.3), 0 20px 50px rgba(139,26,26,0.2), inset 0 1px 0 rgba(255,255,255,0.9); }
  }

  .logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 26px; }
  .logo .badge {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e74c3c, #8b1a1a 70%);
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 0 24px rgba(245, 158, 11, 0.5),
      inset 0 2px 6px rgba(255, 200, 120, 0.4),
      inset 0 -3px 8px rgba(0, 0, 0, 0.4);
    animation: badgePulse 3s ease-in-out infinite;
  }
  @keyframes badgePulse {
    0%, 100% { box-shadow: 0 0 18px rgba(245,158,11,0.35), inset 0 2px 6px rgba(255,200,120,0.4), inset 0 -3px 8px rgba(0,0,0,0.4); }
    50%      { box-shadow: 0 0 32px rgba(245,158,11,0.6), inset 0 2px 6px rgba(255,200,120,0.5), inset 0 -3px 8px rgba(0,0,0,0.4); }
  }
  .logo h1 {
    margin-top: 14px; font-size: 22px; color: #8b1a1a;
    letter-spacing: 4px; text-shadow: 0 2px 6px rgba(139, 26, 26, 0.15); font-weight: 800;
  }
  .logo .sub { margin-top: 4px; font-size: 12px; color: rgba(139, 26, 26, 0.6); letter-spacing: 3px; }

  .tabs {
    position: relative; display: flex;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 14px; padding: 5px; margin-bottom: 28px;
    border: 1px solid rgba(139, 26, 26, 0.2);
  }
  .tab-btn {
    flex: 1; padding: 11px 0;
    background: transparent; border: none;
    color: rgba(139, 26, 26, 0.55);
    font-size: 15px; font-weight: 600; letter-spacing: 2px;
    cursor: pointer; border-radius: 10px;
    transition: color 0.3s ease; position: relative; z-index: 2;
  }
  .tab-btn.active { color: #fff; }
  .tab-indicator {
    position: absolute; top: 5px; left: 5px;
    width: calc(50% - 5px); height: calc(100% - 10px);
    background: linear-gradient(135deg, #e74c3c, #8b1a1a);
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(139, 26, 26, 0.5);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 1;
  }
  .tab-indicator.right { transform: translateX(100%); }

  .form-panel { display: none; animation: fadeIn 0.4s ease; }
  .form-panel.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .field { position: relative; margin-bottom: 18px; }
  .field .icon {
    position: absolute; left: 16px; top: 50%;
    transform: translateY(-50%);
    font-size: 18px; color: #b8860b;
    pointer-events: none; z-index: 2;
    transition: filter 0.3s;
  }
  .field input {
    width: 100%; height: 50px;
    padding: 0 18px 0 48px;
    background: rgba(255, 255, 255, 0.95);
    border: 1.5px solid rgba(139, 26, 26, 0.25);
    border-radius: 12px;
    color: #3a3a3a; font-size: 15px; outline: none;
    transition: all 0.3s ease;
  }
  .field input::placeholder { color: rgba(120, 100, 80, 0.45); }
  .field input:focus {
    border-color: #8b1a1a;
    box-shadow:
      0 0 0 3px rgba(139, 26, 26, 0.12),
      0 0 16px rgba(184, 134, 11, 0.35);
    animation: focusBreath 1.8s ease-in-out infinite;
  }
  @keyframes focusBreath {
    0%, 100% { box-shadow: 0 0 0 3px rgba(139,26,26,0.1), 0 0 12px rgba(184,134,11,0.25); }
    50%      { box-shadow: 0 0 0 3px rgba(139,26,26,0.22), 0 0 22px rgba(184,134,11,0.5); }
  }
  .field:focus-within .icon { filter: drop-shadow(0 0 6px #b8860b); }

  .submit-btn {
    width: 100%; height: 50px; margin-top: 10px;
    border: none; border-radius: 12px;
    background: linear-gradient(135deg, #c0392b 0%, #8b1a1a 42%, #b8860b 100%);
    color: #fff8e7; font-size: 16px; font-weight: 700; letter-spacing: 6px;
    cursor: pointer; position: relative; overflow: hidden;
    box-shadow: 0 6px 18px rgba(139, 26, 26, 0.5);
    transition: all 0.3s ease;
  }
  .submit-btn::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(245,158,11,0.4), rgba(245,158,11,0));
    opacity: 0; transition: opacity 0.3s;
  }
  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(139, 26, 26, 0.6), 0 0 22px rgba(245, 158, 11, 0.4);
  }
  .submit-btn:hover::before { opacity: 1; }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
  .submit-btn.loading { position: relative; overflow: hidden; }
  .submit-btn.loading::after {
    content: ''; position: absolute;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    right: 22px; top: 50%;
    transform: translateY(-50%);
    animation: loginBtnSpin 0.7s linear infinite;
  }
  @keyframes loginBtnSpin { to { transform: translateY(-50%) rotate(360deg); } }
  .submit-btn span { position: relative; z-index: 2; }

  .footer-tip {
    margin-top: 18px; text-align: center;
    font-size: 12px; color: rgba(230, 220, 200, 0.5); letter-spacing: 1px;
  }

  .toast-wrap {
    position: fixed; top: 24px; right: 24px; z-index: 9999;
    display: flex; flex-direction: column; gap: 12px; pointer-events: none;
  }
  .toast {
    min-width: 260px; max-width: 360px;
    padding: 14px 18px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(40, 10, 10, 0.92), rgba(25, 6, 6, 0.92));
    backdrop-filter: blur(12px);
    border: 1px solid;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    display: flex; align-items: center; gap: 12px;
    font-size: 14px; color: #fff8e7;
    pointer-events: auto;
    transform: translateX(120%); opacity: 0;
    animation: toastIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .toast.hide { animation: toastOut 0.35s ease forwards; }
  .toast.success { border-color: rgba(34, 197, 94, 0.6); box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 18px rgba(34,197,94,0.25); }
  .toast.error   { border-color: rgba(239, 68, 68, 0.6); box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 18px rgba(239,68,68,0.25); }
  .toast.info    { border-color: rgba(245, 158, 11, 0.6); box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 18px rgba(245,158,11,0.25); }
  .toast .toast-icon { font-size: 20px; flex-shrink: 0; }
  .toast .toast-msg { flex: 1; line-height: 1.5; word-break: break-word; }
  @keyframes toastIn {
    from { transform: translateX(120%); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  @keyframes toastOut {
    from { transform: translateX(0); opacity: 1; }
    to   { transform: translateX(120%); opacity: 0; }
  }

  @media (max-width: 480px) {
    .auth-card { padding: 32px 24px 28px; }
    .logo h1 { font-size: 19px; letter-spacing: 2px; }
    .toast-wrap { left: 16px; right: 16px; top: 16px; }
    .toast { min-width: 0; }
  }
</style>
</head>
<body>

  <div class="rays"></div>

  <svg class="big-star" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f5deb3"/>
        <stop offset="100%" stop-color="#8b6914"/>
      </linearGradient>
    </defs>
    <path fill="url(#starGrad)" d="M50 4 L61 38 L97 38 L68 59 L79 93 L50 72 L21 93 L32 59 L3 38 L39 38 Z"/>
  </svg>

  <div class="mini-stars" id="miniStars"></div>

  <div class="auth-card">
    <div class="logo">
      <div class="badge">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2 L14.5 8.5 L21.5 9.2 L16.3 13.8 L17.9 20.7 L12 17.2 L6.1 20.7 L7.7 13.8 L2.5 9.2 L9.5 8.5 Z"
                fill="#fde68a" stroke="#fff8e7" stroke-width="0.5"/>
        </svg>
      </div>
      <h1>RedPic · 红色文化多模态解析</h1>
      <div class="sub">RED CULTURE · MULTIMODAL AI</div>
    </div>

    <div class="tabs">
      <div class="tab-indicator" id="tabIndicator"></div>
      <button class="tab-btn active" data-tab="login">登 录</button>
      <button class="tab-btn" data-tab="register">注 册</button>
    </div>

    <form class="form-panel active" id="loginForm" autocomplete="off">
      <div class="field">
        <input type="text" id="loginUser" placeholder="请输入用户名" required />
        <span class="icon">👤</span>
      </div>
      <div class="field">
        <input type="password" id="loginPass" placeholder="请输入密码" required />
        <span class="icon">🔒</span>
      </div>
      <button type="submit" class="submit-btn" id="loginSubmit"><span>登 录</span></button>
      <div class="footer-tip">革命尚未成功，同志仍需努力</div>
    </form>

    <form class="form-panel" id="registerForm" autocomplete="off">
      <div class="field">
        <input type="text" id="regUser" placeholder="请输入用户名" required />
        <span class="icon">👤</span>
      </div>
      <div class="field">
        <input type="password" id="regPass" placeholder="请输入密码" required />
        <span class="icon">🔒</span>
      </div>
      <div class="field">
        <input type="password" id="regPass2" placeholder="请再次输入密码" required />
        <span class="icon">✔️</span>
      </div>
      <button type="submit" class="submit-btn" id="regSubmit"><span>注 册</span></button>
      <div class="footer-tip">加入我们，传承红色基因</div>
    </form>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

<script>
(function(){
  const API_BASE = 'http://localhost:8080/api/auth';

  /* ================= 全局请求拦截器 ================= */
  function handleForceLogout(msg) {
    localStorage.removeItem('satoken');
    window.dispatchEvent(new CustomEvent('api-error', { detail: msg || '登录已失效' }));
    setTimeout(() => window.location.replace('login.html'), 900);
  }
  const $api = {
    async request(opts) {
      const options = {
        headers: { 'satoken': localStorage.getItem('satoken') || '' },
        ...opts
      };
      if (options.body instanceof FormData) delete options.headers['Content-Type'];
      let res, text = '', json = {};
      try {
        res = await fetch(options.url, options);
        text = await res.text();
        json = text ? JSON.parse(text) : {};
      } catch (e) {
        const msg = '网络异常，请检查后端服务是否启动';
        window.dispatchEvent(new CustomEvent('api-error', { detail: msg }));
        throw new Error(msg);
      }

      const isUnauthorized = json.code === 401 || (res && res.status === 401);
      if (isUnauthorized) { handleForceLogout(json.message); throw new Error('UNAUTHORIZED'); }

      if (json.code === 400 || json.code === 500) {
        const msg = json.message || (json.code === 400 ? '请求参数错误' : '服务器开小差了');
        window.dispatchEvent(new CustomEvent('api-error', { detail: msg }));
        throw new Error(msg);
      }

      if (json.code === 200) return json.data;

      if (res && res.status === 200 && json.code == null) return json.data !== undefined ? json.data : json;

      const msg = json.message || ('请求失败（HTTP ' + (res && res.status) + '）');
      window.dispatchEvent(new CustomEvent('api-error', { detail: msg }));
      throw new Error(msg);
    },
    postForm: (url, params) => {
      const body = new URLSearchParams();
      for (const k in params) body.append(k, params[k]);
      return $api.request({ url, method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'}, body });
    }
  };

  /* ================= 按钮 Loading 工具 ================= */
  function setBtnLoading(btn, loading, loadingText){
    const span = btn.querySelector('span') || btn;
    if (loading) {
      btn.disabled = true;
      btn.classList.add('loading');
      if (span === btn) btn.dataset.originalText = btn.textContent;
      else span.dataset.originalText = span.textContent;
      if (loadingText) { span.textContent = loadingText; }
    } else {
      btn.disabled = false;
      btn.classList.remove('loading');
      const orig = span === btn ? btn.dataset.originalText : span.dataset.originalText;
      if (orig) { span.textContent = orig; delete (span === btn ? btn.dataset : span.dataset).originalText; }
    }
  }

  function sanitizeToken(raw) {
    if (!raw) throw new Error('登录凭证异常');
    if (typeof raw === 'object') {
      if (raw.token) return String(raw.token).trim();
      throw new Error('登录凭证异常');
    }
    const str = String(raw).trim();
    if (/[：:]\s*([a-zA-Z0-9\-_.]+)/.test(str)) {
      return str.match(/[：:]\s*([a-zA-Z0-9\-_.]+)/)[1];
    }
    if (/[a-zA-Z0-9\-_.]{6,}/.test(str)) return str;
    throw new Error('登录凭证异常');
  }

  // 生成散落的小五角星
  (function spawnStars(){
    const wrap = document.getElementById('miniStars');
    const starPath = 'M50 4 L61 38 L97 38 L68 59 L79 93 L50 72 L21 93 L32 59 L3 38 L39 38 Z';
    for (let i = 0; i < 18; i++) {
      const size = 8 + Math.random() * 16;
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 's');
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('width', size);
      svg.setAttribute('height', size);
      svg.style.left = Math.random() * 100 + '%';
      svg.style.top  = Math.random() * 100 + '%';
      svg.style.animationDelay = (Math.random() * 4) + 's';
      svg.style.animationDuration = (3 + Math.random() * 3) + 's';
      svg.innerHTML = '<path d="' + starPath + '"/>';
      wrap.appendChild(svg);
    }
  })();

  // Tab 切换
  const tabBtns = document.querySelectorAll('.tab-btn');
  const tabIndicator = document.getElementById('tabIndicator');
  const panels = document.querySelectorAll('.form-panel');
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      tabBtns.forEach(b => b.classList.toggle('active', b === btn));
      tabIndicator.classList.toggle('right', tab === 'register');
      panels.forEach(p => p.classList.toggle('active', p.id === tab + 'Form'));
    });
  });

  // 全局 Toast
  const toastWrap = document.getElementById('toastWrap');
  function toast(msg, type, duration){
    type = type || 'info';
    duration = duration || 2800;
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    const icon = type === 'success' ? '✅' : type === 'error' ? '⚠️' : '💡';
    el.innerHTML = '<span class="toast-icon">' + icon + '</span><span class="toast-msg"></span>';
    el.querySelector('.toast-msg').textContent = msg;
    toastWrap.appendChild(el);
    setTimeout(() => {
      el.classList.add('hide');
      el.addEventListener('animationend', function(){ el.remove(); }, { once: true });
    }, duration);
  }

  /* ================= 全局 API 错误事件监听 ================= */
  window.addEventListener('api-error', (e) => toast(e.detail, 'error'));

  // 登录
  const loginForm = document.getElementById('loginForm');
  const loginSubmit = document.getElementById('loginSubmit');
  loginForm.addEventListener('submit', async function(e){
    e.preventDefault();
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    if (!username || !password) { toast('请填写用户名和密码', 'error'); return; }

    setBtnLoading(loginSubmit, true, '登 录 中...');
    try {
      const raw = await $api.postForm(API_BASE + '/login', { username, password });
      const token = sanitizeToken(raw);
      localStorage.setItem('satoken', token);
      toast('登录成功，欢迎同志！', 'success');
      setTimeout(() => window.location.replace('index.html'), 700);
    } catch (err) {
      // 拦截器已统一弹红色 toast
    } finally {
      setBtnLoading(loginSubmit, false, '登 录');
    }
  });

  // 注册
  const registerForm = document.getElementById('registerForm');
  const regSubmit = document.getElementById('regSubmit');
  registerForm.addEventListener('submit', async function(e){
    e.preventDefault();
    const username = document.getElementById('regUser').value.trim();
    const password = document.getElementById('regPass').value;
    const password2 = document.getElementById('regPass2').value;

    if (!username || !password) { toast('请填写用户名和密码', 'error'); return; }
    if (password !== password2) { toast('两次输入的密码不一致', 'error'); return; }
    if (password.length < 6) { toast('密码长度至少 6 位', 'error'); return; }

    setBtnLoading(regSubmit, true, '注 册 中...');
    try {
      const data = await $api.postForm(API_BASE + '/register', { username, password });
      toast(data || '注册成功，请登录', 'success');
      setTimeout(() => {
        document.querySelector('.tab-btn[data-tab="login"]').click();
        document.getElementById('loginUser').value = username;
        document.getElementById('loginPass').focus();
      }, 600);
    } catch (err) {
      // 拦截器已统一弹红色 toast
    } finally {
      setBtnLoading(regSubmit, false, '注 册');
    }
  });

  // 若本地有 token，验证有效则直接跳转主界面
  const existingToken = (localStorage.getItem('satoken') || '').trim();
  if (existingToken) {
    fetch(API_BASE + '/check', { headers: { 'satoken': existingToken } })
      .then(res => {
        if (res.status === 200) window.location.replace('index.html');
        else localStorage.removeItem('satoken');
      })
      .catch(() => localStorage.removeItem('satoken'));
  }
})();
</script>
</body>
</html>
